global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: otel-collector-internal
    static_configs:
      - targets: [otel-collector:8888]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  # EventHorizon's RabbitMQ runs in a SEPARATE compose project, so it is not
  # reachable by container DNS on this stack's `observability` network. The
  # rabbitmq:*-management image exposes the rabbitmq_prometheus plugin on
  # :15692; we reach it via the host gateway (see `extra_hosts` on the
  # prometheus service in docker-compose.yml). On Docker Desktop (Mac/Win)
  # host.docker.internal resolves automatically; on Linux/WSL2 the host-gateway
  # alias is required.
  - job_name: rabbitmq
    static_configs:
      - targets: ["host.docker.internal:15692"]
